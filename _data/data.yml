experiences:
  title: Experiences
  info:
  - role: Developer of Cue Rehearsal Techniques / Rehearsal Monitor
    time: 2023 - present
    company:
    details: |
      Cue Rehearsal Techniques is a music pedagogy mobile app for young and seasoned teachers alike.
      Users can easily browse applicable reherasal techniques at the touch of a button, as well as
      create and share lesson plans with staff and students. Rehearsal Monitor categorizes audio into one of
      four different categories: music, talking, silence, noise. This feedback lets music teachers visually see
      how effective they are and how they are using lesson time. Project links below.
  - role: Graduate Assistant - Wind Band Conducting
    time: 2024 - present
    company: The University of Texas at El Paso, El Paso, TX
    details: |
        - UTEP Marching Miners - Graduate Teaching Assistant
        - UTEP Basketball Band Conductor
        - UTEP 2025 Summer Band Camps Coordinator
        - University of Oregon, University of Georgia Conducting Workshop Invitee
  - role: Assistant Band Director
    time: 2022 - 2024
    company: Pecos High School, Pecos, TX
    details: |
        - Director of the Symphonic Non-Varsity (4A) and Jazz ensembles
        - Sweepstakes, Non-Varsity OPS State-Advancing selections (2, 2024)
        - Assisted with musical and visual aspects of the Pecos Eagle Marching Band (SMB Appearances, BOA 1A Regional/Super Regianl Champions)
        - Taught beginner horn, trumpet and assisted ensembles at Crockett Middle School
  - role: Software Developer
    time: 2018 - 2019
    company: USAA, San Antonio, TX
    details: |
        - Front-end developer for car buying and selling (React.js)
        - Back-end developer for banking (Java)
        - Aided team in following project management and compliance guidelines (Agile)

