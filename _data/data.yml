career-profile:
  title: About Cole
  summary: |
    Coleman Spears is a graduate assistant at the University of Texas at El Paso, 
    where he studies Wind Band Conducting under Dr. Andrew Hunter. He previously served 
    as the Assistant Director of Bands at Pecos High School in Pecos, TX. He holds degrees 
    from Stephen F. Austin State University (2022, B.M. Music Education) and Abilene Christian 
    University (2018, B.S. Computer Science).

    His interests and research includes music education and technology, creating tools for 
    young music educators, such as Cue Rehearsal Techniques and Rehearsal Monitor. Coleman
    Spears is passionate about music, technology, and empowering the next generation of students 
    to utilize both studies in becoming better global citizens.

